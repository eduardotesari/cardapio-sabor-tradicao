<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardápio Digital — Restaurante Sabor & Tradição</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --card: #FFFFFF;
      --ink: #1A1A1A;
      --muted: #3D3D3D;
      --verde: #1B4332;
      --verde-claro: #D1FAE5;
      --verde-texto: #065F46;
      --borda: #CBD5E1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 22px;
      line-height: 1.45;
      padding-bottom: 130px;
    }
    header {
      background: var(--verde);
      color: #FFFFFF;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 28px; }
    .mesa {
      background: #FFFFFF;
      color: var(--verde);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 800;
      min-height: 48px;
      display: flex;
      align-items: center;
    }
    .barra-topo {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #FFFFFF;
      border-bottom: 2px solid var(--borda);
      padding: 14px 20px;
    }
    .cats, .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .filtros {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #E2E8F0;
    }
    button {
      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      min-height: 52px;
      padding: 10px 18px;
      border-radius: 12px;
      border: 2px solid var(--verde);
      background: #FFFFFF;
      color: var(--verde);
      cursor: pointer;
    }
    button.ativo {
      background: var(--verde);
      color: #FFFFFF;
    }
    .btn-acao {
      background: var(--verde-texto);
      border-color: var(--verde-texto);
      color: #FFFFFF;
      width: 100%;
    }
    .btn-acao:disabled {
      background: #94A3B8;
      border-color: #94A3B8;
      cursor: not-allowed;
    }
    main {
      max-width: 1160px;
      margin: 24px auto;
      padding: 0 20px;
    }
    .topo-lista {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .item {
      background: var(--card);
      border: 2px solid var(--borda);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .selo {
      display: inline-block;
      background: var(--verde-claro);
      color: var(--verde-texto);
      border: 1.5px solid var(--verde-texto);
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      margin-right: 8px;
      margin-top: 6px;
    }
    .preco { font-size: 26px; font-weight: 800; }
    .rodape-carrinho {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border-top: 3px solid var(--verde);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      z-index: 30;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal.aberto { display: flex; }
    .caixa-modal {
      background: #FFFFFF;
      border: 3px solid var(--verde);
      border-radius: 16px;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .opcao-btn {
      width: 100%;
      text-align: left;
      margin-top: 10px;
    }
    .opcao-btn.marcada {
      background: var(--verde-claro);
      color: var(--verde-texto);
      border-color: var(--verde-texto);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Restaurante Sabor &amp; Tradição</h1>
      <p style="font-size:19px;">Cardápio Digital • Toque nos botões para filtrar e pedir</p>
    </div>
    <div class="mesa">Mesa 04</div>
  </header>

  <div class="barra-topo">
    <div class="cats" id="listaCategorias">
      <button type="button" class="ativo" data-cat="Todos">Todos</button>
      <button type="button" data-cat="Carnes">Carnes</button>
      <button type="button" data-cat="Peixes">Peixes</button>
      <button type="button" data-cat="Entradas">Entradas</button>
      <button type="button" data-cat="Vegetarianos">Massas, Veg e Kids</button>
      <button type="button" data-cat="Sobremesas">Sobremesas</button>
      <button type="button" data-cat="Bebidas">Bebidas</button>
    </div>
    <div class="filtros">
      <span>Restrição:</span>
      <button type="button" id="btnLactose">Sem Lactose</button>
      <button type="button" id="btnGluten">Sem Glúten</button>
      <button type="button" id="btnLimpar" style="display:none;">Limpar Filtros</button>
    </div>
  </div>

  <main>
    <div class="topo-lista">
      <h2 id="tituloLista">Todos os Pratos e Bebidas</h2>
      <span id="contadorItens">0 opções</span>
    </div>
    <div class="grid" id="gridItens"></div>
  </main>

  <div class="rodape-carrinho">
    <div>
      <div id="resumoQtd" style="font-size:19px;">Pedido vazio</div>
      <div id="resumoTotal" style="font-size:26px;font-weight:800;color:var(--verde);">Total: R$ 0,00</div>
    </div>
    <button type="button" class="btn-acao" style="width:auto;" id="btnAbrirCarrinho" disabled>Revisar e Enviar Pedido</button>
  </div>

  <div class="modal" id="modalPersonaliza">
    <div class="caixa-modal">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
        <h3 id="tituloModalItem">Personalizar</h3>
        <button type="button" id="fecharModalItem">Fechar</button>
      </div>
      <p id="descModalItem"></p>
      <div id="opcoesModalItem"></div>
      <div style="display:flex;align-items:center;gap:16px;margin-top:8px;">
        <button type="button" id="menosQtd">−</button>
        <strong id="qtdAtual">1</strong>
        <button type="button" id="maisQtd">+</button>
      </div>
      <button type="button" class="btn-acao" id="confirmarAdicionar">Adicionar ao Pedido</button>
    </div>
  </div>

  <div class="modal" id="modalCarrinho">
    <div class="caixa-modal">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
        <h3>Seu Pedido</h3>
        <button type="button" id="fecharModalCarrinho">Fechar</button>
      </div>
      <div id="itensCarrinhoHtml"></div>
      <strong id="totalModalCarrinho" style="font-size:26px;">Total: R$ 0,00</strong>
      <button type="button" class="btn-acao" id="enviarCozinha">Confirmar e Enviar para a Cozinha</button>
    </div>
  </div>

  <script>
    const itens = [
      { id: 1, nome: "Bife Imperial do Barão", sub: "Contrafilé grelhado com arroz e legumes • Serve 1 pessoa", cat: "Carnes", preco: 98, semLactose: true, semGluten: true, opcoes: ["Retirar cebola", "Retirar alho"] },
      { id: 2, nome: "Segredo da Fazenda", sub: "Costela assada com farofa e legumes • Serve 2 pessoas", cat: "Carnes", preco: 128, semLactose: true, semGluten: false, opcoes: ["Retirar cebola"] },
      { id: 3, nome: "Filé à Moda do Fundador", sub: "Filé mignon ao molho escuro e batatas • Serve 1 pessoa", cat: "Carnes", preco: 115, semLactose: false, semGluten: true, opcoes: ["Retirar cebola"] },
      { id: 4, nome: "Medalhão Fantasia de Sabores", sub: "Filé mignon com queijo e purê • Serve 1 pessoa", cat: "Carnes", preco: 105, semLactose: false, semGluten: true, opcoes: ["Retirar cebola", "Sem queijo"] },
      { id: 5, nome: "Bacalhau Dourado dos Navegantes", sub: "Posta no azeite com batatas • Serve 2 pessoas", cat: "Peixes", preco: 160, semLactose: true, semGluten: true, opcoes: ["Retirar cebola"] },
      { id: 6, nome: "Moqueca Encanto das Águas", sub: "Peixe branco com leite de coco e arroz • Serve 2 pessoas", cat: "Peixes", preco: 145, semLactose: true, semGluten: true, opcoes: ["Retirar cebola", "Sem pimentão"] },
      { id: 7, nome: "Salmão Nobre da Montanha", sub: "Salmão ao molho cítrico e grãos • Serve 1 pessoa", cat: "Peixes", preco: 125, semLactose: true, semGluten: true, opcoes: ["Retirar cebola"] },
      { id: 8, nome: "Camarão Suprema Harmonia", sub: "Camarões ao alho com arroz cremoso • Serve 2 pessoas", cat: "Peixes", preco: 138, semLactose: false, semGluten: true, opcoes: ["Retirar cebola"] },
      { id: 9, nome: "Delícia Colonial", sub: "Embutidos e torradas artesanais • Serve 2 pessoas", cat: "Entradas", preco: 48, semLactose: true, semGluten: false, opcoes: ["Retirar cebola"] },
      { id: 10, nome: "Surpresa do Mar do Sul", sub: "Iscas de peixe empanadas • Serve 2 pessoas", cat: "Entradas", preco: 62, semLactose: false, semGluten: false, opcoes: ["Molho à parte"] },
      { id: 11, nome: "Mistério de Queijos e Ervas", sub: "Queijos variados, geleia e pães • Serve 2 pessoas", cat: "Entradas", preco: 44, semLactose: false, semGluten: false, opcoes: ["Sem pães"] },
      { id: 12, nome: "Jardim do Éden Verde", sub: "Grãos, legumes no vapor e cogumelos • Serve 1 pessoa", cat: "Vegetarianos", preco: 58, semLactose: true, semGluten: true, opcoes: ["Retirar cebola"] },
      { id: 13, nome: "Massa do Artista ao Molho Secreto", sub: "Espaguete com molho de tomate • Serve 1 pessoa", cat: "Vegetarianos", preco: 68, semLactose: true, semGluten: false, opcoes: ["Retirar cebola"] },
      { id: 14, nome: "Prato da Alegria (Kids)", sub: "Carne macia, arroz e batatas • Infantil", cat: "Vegetarianos", preco: 42, semLactose: true, semGluten: true, opcoes: ["Sem batatas"] },
      { id: 15, nome: "Doce Tentação da Vovó", sub: "Sobremesa gelada com calda de frutas • Serve 1 pessoa", cat: "Sobremesas", preco: 28, semLactose: false, semGluten: true, opcoes: ["Calda à parte"] },
      { id: 16, nome: "Água Mineral com Gás (500ml)", sub: "Garrafa 500ml", cat: "Bebidas", preco: 9, semLactose: true, semGluten: true, opcoes: ["Com gelo e limão", "Sem gelo"] },
      { id: 17, nome: "Água Mineral sem Gás (500ml)", sub: "Garrafa 500ml", cat: "Bebidas", preco: 9, semLactose: true, semGluten: true, opcoes: ["Gelada", "Natural"] }
    ];

    let catAtual = "Todos";
    let soLactose = false;
    let soGluten = false;
    let carrinho = [];
    let itemSelecionado = null;
    let qtdItem = 1;
    let obsEscolhidas = new Set();

    const moeda = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

    function renderLista() {
      const filtrados = itens.filter(i =>
        (catAtual === "Todos" || i.cat === catAtual) &&
        (!soLactose || i.semLactose) &&
        (!soGluten || i.semGluten)
      );
      document.getElementById("tituloLista").textContent = catAtual === "Todos" ? "Todos os Pratos e Bebidas" : catAtual;
      document.getElementById("contadorItens").textContent = filtrados.length + " opções";
      const grid = document.getElementById("gridItens");
      grid.innerHTML = filtrados.map(i => `
        <div class="item">
          <div>
            <h3>${i.nome}</h3>
            <p style="font-size:19px;color:var(--muted);margin-top:4px;">${i.sub}</p>
            <div>
              ${i.semLactose ? '<span class="selo">Sem Lactose</span>' : ''}
              ${i.semGluten ? '<span class="selo">Sem Glúten</span>' : ''}
            </div>
          </div>
          <div>
            <div class="preco" style="margin-bottom:10px;">${moeda(i.preco)}</div>
            <button type="button" class="btn-acao" onclick="abrirModal(${i.id})">Escolher e Personalizar</button>
          </div>
        </div>
      `).join("");
    }

    document.querySelectorAll("#listaCategorias button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#listaCategorias button").forEach(b => b.classList.remove("ativo"));
        btn.classList.add("ativo");
        catAtual = btn.dataset.cat;
        renderLista();
      });
    });

    function atualizarBotoesFiltro() {
      document.getElementById("btnLactose").classList.toggle("ativo", soLactose);
      document.getElementById("btnGluten").classList.toggle("ativo", soGluten);
      document.getElementById("btnLimpar").style.display = (soLactose || soGluten) ? "inline-block" : "none";
      renderLista();
    }

    document.getElementById("btnLactose").addEventListener("click", () => { soLactose = !soLactose; atualizarBotoesFiltro(); });
    document.getElementById("btnGluten").addEventListener("click", () => { soGluten = !soGluten; atualizarBotoesFiltro(); });
    document.getElementById("btnLimpar").addEventListener("click", () => { soLactose = false; soGluten = false; atualizarBotoesFiltro(); });

    function abrirModal(id) {
      itemSelecionado = itens.find(i => i.id === id);
      qtdItem = 1;
      obsEscolhidas.clear();
      document.getElementById("tituloModalItem").textContent = itemSelecionado.nome;
      document.getElementById("descModalItem").textContent = itemSelecionado.sub;
      document.getElementById("qtdAtual").textContent = "1";
      const box = document.getElementById("opcoesModalItem");
      box.innerHTML = itemSelecionado.opcoes.map(op =>
        `<button type="button" class="opcao-btn" onclick="toggleObs(this, '${op}')">${op}</button>`
      ).join("");
      document.getElementById("modalPersonaliza").classList.add("aberto");
    }

    function toggleObs(el, op) {
      if (obsEscolhidas.has(op)) { obsEscolhidas.delete(op); el.classList.remove("marcada"); }
      else { obsEscolhidas.add(op); el.classList.add("marcada"); }
    }

    document.getElementById("menosQtd").addEventListener("click", () => {
      if (qtdItem > 1) { qtdItem--; document.getElementById("qtdAtual").textContent = qtdItem; }
    });
    document.getElementById("maisQtd").addEventListener("click", () => {
      qtdItem++; document.getElementById("qtdAtual").textContent = qtdItem;
    });
    document.getElementById("fecharModalItem").addEventListener("click", () => {
      document.getElementById("modalPersonaliza").classList.remove("aberto");
    });

    document.getElementById("confirmarAdicionar").addEventListener("click", () => {
      carrinho.push({
        nome: itemSelecionado.nome,
        preco: itemSelecionado.preco,
        qtd: qtdItem,
        obs: Array.from(obsEscolhidas).join(", ") || "Padrão"
      });
      document.getElementById("modalPersonaliza").classList.remove("aberto");
      atualizarCarrinho();
    });

    function atualizarCarrinho() {
      const qtdTotal = carrinho.reduce((s, x) => s + x.qtd, 0);
      const valorTotal = carrinho.reduce((s, x) => s + x.qtd * x.preco, 0);
      document.getElementById("resumoQtd").textContent = qtdTotal ? `${qtdTotal} item(ns) no pedido` : "Pedido vazio";
      document.getElementById("resumoTotal").textContent = `Total: ${moeda(valorTotal)}`;
      document.getElementById("btnAbrirCarrinho").disabled = qtdTotal === 0;
    }

    document.getElementById("btnAbrirCarrinho").addEventListener("click", () => {
      const valorTotal = carrinho.reduce((s, x) => s + x.qtd * x.preco, 0);
      document.getElementById("itensCarrinhoHtml").innerHTML = carrinho.map(x =>
        `<div style="border:1.5px solid var(--borda);padding:12px;border-radius:10px;margin-bottom:10px;">
          <strong>${x.qtd}x ${x.nome}</strong> — ${moeda(x.qtd * x.preco)}<br>
          <span style="font-size:18px;color:var(--verde-texto);">Obs: ${x.obs}</span>
        </div>`
      ).join("");
      document.getElementById("totalModalCarrinho").textContent = `Total: ${moeda(valorTotal)}`;
      document.getElementById("modalCarrinho").classList.add("aberto");
    });

    document.getElementById("fecharModalCarrinho").addEventListener("click", () => {
      document.getElementById("modalCarrinho").classList.remove("aberto");
    });

    document.getElementById("enviarCozinha").addEventListener("click", () => {
      document.getElementById("itensCarrinhoHtml").innerHTML = "<p style='font-weight:700;color:var(--verde-texto);'>Pedido enviado para a cozinha com sucesso!</p>";
      carrinho = [];
      atualizarCarrinho();
    });

    renderLista();
  </script>
</body>
</html>
